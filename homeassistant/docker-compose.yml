services:
  homeassistant:
    image: 'ghcr.io/home-assistant/home-assistant:stable'
    container_name: homeassistant
    restart: unless-stopped
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - config:/config
      - ./config/configuration.yaml:/config/configuration.yaml
    privileged: true
    network_mode: host
    devices:
      - /dev/ttyUSB1:/dev/ttyUSB1
  zwave:
    container_name: zwave
    image: zwavejs/zwave-js-ui:latest
    restart: always
    tty: true
    stop_signal: SIGINT
    privileged: true
    network_mode: host
    devices:
      - '/dev/serial/by-id/usb-Silicon_Labs_HubZ_Smart_Home_Controller_7150097E-if00-port0:/dev/zwave'
    volumes:
      - zwave-config:/usr/src/app/store
    ports:
      - '8091:8091' # port for web interface
      - '3000:3000' # port for Z-Wave JS websocket server
  mosquitto:
    container_name: mosquitto
    image: eclipse-mosquitto:2
    restart: unless-stopped
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    ports:
      # Published on the host so that Home Assistant (which uses host
      # networking) can reach the broker at localhost:1883
      - '1883:1883'
  zigbee2mqtt:
    container_name: zigbee2mqtt
    image: koenkk/zigbee2mqtt:latest
    restart: unless-stopped
    depends_on:
      - mosquitto
    devices:
      # The Zigbee half of the HubZ combo stick (the Z-Wave half is used by
      # the zwave service above)
      - '/dev/serial/by-id/usb-Silicon_Labs_HubZ_Smart_Home_Controller_7150097E-if01-port1:/dev/zigbee'
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - zigbee2mqtt-data:/app/data
      - ./zigbee2mqtt/configuration.yaml:/app/data/configuration.yaml
    ports:
      - '8080:8080' # port for web interface

volumes:
  config:
  zwave-config:
  mosquitto-data:
  zigbee2mqtt-data:
