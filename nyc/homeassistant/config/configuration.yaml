# Loads default set of integrations. Do not remove.
default_config:

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

prometheus:

# HomeKit needs three things to work from a Docker bridge network: the avahi
# reflector container, port 21063 published on the host, and advertise_ip set
# to the host's LAN address so iPhones connect to the host rather than the
# unroutable container IP. Configure HomeKit here rather than in the UI, and
# keep a single bridge.
homekit:
  - port: 21063
    advertise_ip: 10.0.90.10
    filter:
      include_domains:
        - light
      include_entity_globs:
        - binary_sensor.*_contact
        - sensor.*_carbon_dioxide
        - sensor.*_volatile_organic_compounds
      exclude_entities:
        - light.office_lamp_left
        - light.office_lamp_right
    # The Aranet4 monitors' CO2 readings match the sensor.*_carbon_dioxide
    # glob above. The Aranet integration names each device after its
    # Bluetooth name, so without these overrides the Home app would show them
    # as e.g. "Aranet4 39F04 Carbon Dioxide" next to the ecobee's "Bedroom
    # Carbon dioxide".
    entity_config:
      sensor.aranet4_3b572_carbon_dioxide:
        name: Living Room Aranet CO2
      sensor.aranet4_39f04_carbon_dioxide:
        name: Bedroom Aranet CO2
      sensor.aranet4_3c2c7_carbon_dioxide:
        name: Office Aranet CO2
