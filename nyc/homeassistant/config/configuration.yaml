
# Configure a default setup of Home Assistant (frontend, api, etc)
default_config:

# Text to speech
tts:
  - platform: google_translate

#group: !include groups.yaml
automation: !include automations.yaml
script: !include scripts.yaml
#scene: !include scenes.yaml

http:
  use_x_forwarded_for: true
  trusted_proxies: 172.16.0.0/12

prometheus:

climate:

input_boolean:
  art_lamp_state:
    name: Art Lamp State
  kitchen_light_state:
    name: Kitchen Light State

input_number:
  art_lamp_brightness:
    name: Art Lamp Brightness
    min: 64
    max: 255
    step: 64
  kitchen_light_brightness:
    name: Kitchen Light Brightness
    min: 64
    max: 255
    step: 64

template:
  - light:
      - name: "Art Lamp"
        unique_id: art_lamp
        state: "{{ states('input_boolean.art_lamp_state') }}"
        level: "{{ states('input_number.art_lamp_brightness') | int }}"
        turn_on:
          - action: script.turn_on_art_lamp
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.art_lamp_state
        turn_off:
          - action: script.turn_off_art_lamp
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.art_lamp_state
        set_level:
          - if:
              - condition: state
                entity_id: input_boolean.art_lamp_state
                state: "off"
            then:
              - action: script.turn_on_art_lamp
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.art_lamp_state
              - delay:
                  milliseconds: 500
          - repeat:
              while:
                - condition: template
                  value_template: "{{ brightness > states('input_number.art_lamp_brightness') | int }}"
              sequence:
                - action: script.increase_brightness_of_art_lamp
                - action: input_number.set_value
                  target:
                    entity_id: input_number.art_lamp_brightness
                  data:
                    value: "{{ states('input_number.art_lamp_brightness') | int + 64 }}"
                - delay:
                    milliseconds: 300
          - repeat:
              while:
                - condition: template
                  value_template: "{{ brightness < states('input_number.art_lamp_brightness') | int }}"
              sequence:
                - action: script.decrease_brightness_of_art_lamp
                - action: input_number.set_value
                  target:
                    entity_id: input_number.art_lamp_brightness
      - name: "Kitchen Light"
        unique_id: kitchen_light
        state: "{{ states('input_boolean.kitchen_light_state') }}"
        level: "{{ states('input_number.kitchen_light_brightness') | int }}"
        turn_on:
          - action: script.toggle_kitchen_light
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.kitchen_light_state
        turn_off:
          - action: script.toggle_kitchen_light
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.kitchen_light_state
        set_level:
          - if:
              - condition: state
                entity_id: input_boolean.kitchen_light_state
                state: "off"
            then:
              - action: script.toggle_kitchen_light
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.kitchen_light_state
              - delay:
                  milliseconds: 500
          - repeat:
              while:
                - condition: template
                  value_template: "{{ brightness > states('input_number.kitchen_light_brightness') | int and states('input_number.kitchen_light_brightness') | int < 255 }}"
              sequence:
                - action: script.increase_brightness_of_kitchen_light
                - action: input_number.set_value
                  target:
                    entity_id: input_number.kitchen_light_brightness
                  data:
                    value: "{{ [states('input_number.kitchen_light_brightness') | int + 64, 255] | min }}"
                - delay:
                    milliseconds: 300
          - repeat:
              while:
                - condition: template
                  value_template: "{{ brightness < states('input_number.kitchen_light_brightness') | int and states('input_number.kitchen_light_brightness') | int > 64 }}"
              sequence:
                - action: script.decrease_brightness_of_kitchen_light
                - action: input_number.set_value
                  target:
                    entity_id: input_number.kitchen_light_brightness
                  data:
                    value: "{{ [states('input_number.kitchen_light_brightness') | int - 64, 64] | max }}"
                - delay:
                    milliseconds: 300
