services:
  homeassistant:
    image: 'ghcr.io/home-assistant/home-assistant:stable'
    container_name: homeassistant
    restart: unless-stopped
    volumes:
      - '/etc/localtime:/etc/localtime:ro'
      # Mount the whole config directory, never the individual YAML files.
      # The UI editors rewrite automations.yaml, scenes.yaml and scripts.yaml
      # by writing a temp file and renaming it into place, and the kernel
      # refuses to rename over a mount point, so a single-file bind mount
      # makes every save fail with "Errno 16 Resource busy". See the README.
      - './config:/config'
    expose:
      - 8123
    ports:
      - '21063:21063'
    networks:
      - web
      - default
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=web'
      - 'traefik.http.routers.homeassistant.rule=Host(`home.nyc.brooks.network`)'
      - 'traefik.http.routers.homeassistant.entrypoints=websecure'
      - 'traefik.http.routers.homeassistant.tls.certresolver=letsencrypt'
      - 'traefik.http.services.homeassistant.loadbalancer.server.port=8123'

  mqtt:
    image: 'eclipse-mosquitto:2'
    container_name: mqtt
    restart: unless-stopped
    volumes:
      - './mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro'
      - 'mqtt-data:/mosquitto/data'
    ports:
      - '1883:1883'

  zigbee2mqtt:
    image: 'koenkk/zigbee2mqtt:latest'
    container_name: zigbee2mqtt
    restart: unless-stopped
    depends_on:
      - mqtt
    devices:
      - '/dev/serial/by-id/usb-Silicon_Labs_HubZ_Smart_Home_Controller_6160005F-if01-port0:/dev/zigbee'
    volumes:
      - '/etc/localtime:/etc/localtime:ro'
      - 'zigbee2mqtt-data:/app/data'
      - './zigbee2mqtt/configuration.yaml:/app/data/configuration.yaml'
    expose:
      - 8080
    networks:
      - web
      - default
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=web'
      - 'traefik.http.routers.zigbee2mqtt.rule=Host(`zigbee.nyc.brooks.network`)'
      - 'traefik.http.routers.zigbee2mqtt.entrypoints=websecure'
      - 'traefik.http.routers.zigbee2mqtt.tls.certresolver=letsencrypt'
      - 'traefik.http.services.zigbee2mqtt.loadbalancer.server.port=8080'

  avahi:
    image: 'flungo/avahi'
    container_name: avahi
    restart: unless-stopped
    network_mode: host
    environment:
      REFLECTOR_ENABLE_REFLECTOR: 'yes'

volumes:
  mqtt-data:
  zigbee2mqtt-data:

networks:
  web:
    external: true
