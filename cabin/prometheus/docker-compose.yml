services:
  prometheus:
    image: 'prom/prometheus'
    container_name: prometheus
    restart: always
    command: '--config.file=/etc/prometheus/prometheus.yml --storage.tsdb.path=/prometheus --storage.tsdb.retention.time=1y'
    volumes:
      - './prometheus.yml:/etc/prometheus/prometheus.yml'
      - 'data:/prometheus'
    ports:
      - '9090:9090'
    networks:
      - metrics

  cadvisor:
    image: 'gcr.io/cadvisor/cadvisor:latest'
    container_name: cadvisor
    volumes:
      - '/:/rootfs:ro'
      - '/var/run:/var/run:rw'
      - '/sys:/sys:ro'
      - '/var/lib/docker/:/var/lib/docker:ro'
    ports:
      - '9080:8080'

  snmp-exporter:
    image: 'prom/snmp-exporter'
    container_name: snmp_exporter
    restart: always
    volumes:
      - './snmp.yml:/etc/snmp_exporter/snmp.yml'
    ports:
      - '9116:9116'

  ecobee-exporter:
    image: 'billykwooten/ecobee-exporter'
    container_name: ecobee-exporter
    restart: always
    env_file:
      - .env
    volumes:
      - 'ecobee-exporter_data:/db'
    ports:
      - '9098:9098'

  ambient-weather-exporter:
    image: 'ghcr.io/ianunruh/ambient-exporter:main'
    container_name: ambient_exporter
    restart: always
    env_file:
      - .env
    ports:
      - '9091:9090'

volumes:
  data:
  ecobee-exporter_data:
    external: true

networks:
  metrics:
    external: true
